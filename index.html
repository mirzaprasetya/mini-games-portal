<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Games Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #2c3e50;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        #app-container {
            width: 400px;
            height: 600px;
            background-color: #1a252f;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow-y: auto;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            box-sizing: border-box;
        }

        /* Hide scrollbar for neatness */
        #app-container::-webkit-scrollbar {
            display: none;
        }
        
        h1 { 
            margin: 10px 0 30px 0; 
            font-size: 28px; 
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }
        
        .card {
            background-color: #34495e;
            border-radius: 15px;
            padding: 15px 20px;
            text-decoration: none;
            color: white;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
            background-color: #3b536b;
        }
        
        .icon {
            font-size: 40px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        
        .text-content {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        
        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #f1c40f;
        }
        
        .desc {
            font-size: 12px;
            line-height: 1.4;
            color: #bdc3c7;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <h1>🎮 Mini-Games Portal</h1>
        <div class="grid">
            <a href="/flappy-bird/" class="card">
                <div class="icon">🐦</div>
                <div class="text-content">
                    <div class="title">Flappy Bird</div>
                    <div class="desc">Endless flying game with multiple birds.</div>
                </div>
            </a>
            <a href="/globle-clone/" class="card">
                <div class="icon">🌍</div>
                <div class="text-content">
                    <div class="title">Globle</div>
                    <div class="desc">Find the country on an interactive 3D globe.</div>
                </div>
            </a>
            <a href="/contexto-clone/" class="card">
                <div class="icon">🧠</div>
                <div class="text-content">
                    <div class="title">Contexto</div>
                    <div class="desc">Guess the secret word based on AI similarity.</div>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
