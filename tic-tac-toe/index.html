<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="header-nav">
            <a href="/" class="home-btn">🏠</a>
            <h1>Tic-Tac-Toe</h1>
        </div>
        
        <div class="menu-container" id="menu">
            <h2>Select Game Mode</h2>
            <button class="mode-btn" data-mode="1p-easy">1 Player (Easy Bot)</button>
            <button class="mode-btn" data-mode="1p-hard">1 Player (Unbeatable Bot)</button>
            <button class="mode-btn" data-mode="2p">2 Players (Pass & Play)</button>
        </div>

        <div class="game-container" id="game" style="display: none;">
            <div class="status-board">
                <span id="status-text">Player X's Turn</span>
            </div>
            
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            
            <div class="controls">
                <button id="restart-btn">Restart Game</button>
                <button id="back-btn">Main Menu</button>
            </div>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="result-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 id="result-message">You Win! 🎉</h2>
            <button id="play-again-btn">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
