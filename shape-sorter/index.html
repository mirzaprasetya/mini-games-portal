<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shape Sorter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <a href="/" class="back-btn">Back / Home</a>
    </div>
    <h1>Shape Sorter</h1>
    <div class="game-container">
        <div class="holes">
            <div class="hole circle-hole" data-shape="circle"></div>
            <div class="hole square-hole" data-shape="square"></div>
            <div class="hole triangle-hole" data-shape="triangle"></div>
        </div>
        <div class="shapes">
            <div class="shape circle" data-shape="circle"></div>
            <div class="shape square" data-shape="square"></div>
            <div class="shape triangle" data-shape="triangle"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
