<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Pomodoro Focus</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <a href="/" class="home-btn">🏠</a>
    <button id="fullscreen-btn" class="home-btn" style="left: auto; right: 20px; top: 20px; bottom: auto; cursor: pointer;">⛶</button>
    <div class="overlay"></div>
    <div class="container">
        <div class="quote-container">
            <p id="quote-text">"The secret of getting ahead is getting started."</p>
            <p id="quote-author">- Mark Twain</p>
            <div class="quote-nav">
                <button id="prev-quote" class="arrow-btn">◀</button>
                <button id="explain-quote" class="arrow-btn">?</button>
                <button id="next-quote" class="arrow-btn">▶</button>
            </div>
        </div>
        
        <div class="timer-card">
            <div id="user-greeting" style="font-size: 16px; font-weight: 600; margin-bottom: 10px; color: #f1c40f; text-align: center; cursor: pointer;" title="Click to change name"></div>
            <h2 id="mode-text">Work Session</h2>
            <div class="time-display" id="time-display">15:00</div>
            
            <div class="controls">
                <button id="start-btn">Start</button>
                <button id="pause-btn" style="display: none;">Pause</button>
                <button id="reset-btn">Reset</button>
            </div>
            
            <div id="prayer-timer"></div>
            
            <div class="settings">
                <div class="setting-group">
                    <label>Work (mins)</label>
                    <div class="stepper">
                        <button class="step-btn" id="work-minus">-</button>
                        <span id="work-val">15</span>
                        <button class="step-btn" id="work-plus">+</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label>Rest (mins)</label>
                    <div class="stepper">
                        <button class="step-btn" id="rest-minus">-</button>
                        <span id="rest-val">5</span>
                        <button class="step-btn" id="rest-plus">+</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label>Rounds</label>
                    <div class="stepper">
                        <button class="step-btn" id="session-minus">-</button>
                        <span id="session-val">1</span>
                        <button class="step-btn" id="session-plus">+</button>
                    </div>
                </div>
            </div>
            
            <div class="stats-container" style="margin-top: 20px; font-size: 14px; opacity: 0.9; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
                <div>🏆 Today: <strong id="daily-sessions-val">0</strong> <strong>mins</strong></div>
                <div>📅 This Month: <strong id="monthly-sessions-val">0</strong> <strong>mins</strong></div>
            </div>

            
            <div class="opacity-control">
                <label>Visibility</label>
                <input type="range" id="opacity-slider" min="0" max="100" value="100">
            </div>
        </div>
        
        <div class="bg-info-container">
            <p id="bg-location">Banff National Park, Canada</p>
            <p id="bg-photographer">Photo by Qusai Akoud</p>
            <div class="bg-nav">
                <button id="prev-bg" class="arrow-btn">◀</button>
                <button id="next-bg" class="arrow-btn">▶</button>
            </div>
        </div>
    </div>

    <!-- Explanation Modal -->
    <div id="explanation-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px;">Quote Insight</h3>
            <p id="explanation-text" style="font-size: 14px; line-height: 1.5; opacity: 0.9; margin: 0;"></p>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal" style="display: none;">
        <div class="modal-content" style="text-align: center; position: relative;">
            <span class="close-modal" id="close-login-modal" style="position: absolute; right: 15px; top: 10px; cursor: pointer; font-size: 20px;">&times;</span>
            <h3 style="margin-top: 0; margin-bottom: 15px;">Welcome to Focus!</h3>
            <p style="font-size: 14px; margin-bottom: 15px;">Enter your nickname and a password to sync your stats across devices.</p>
            <input type="text" id="username-input" placeholder="Nickname" style="padding: 10px; width: 80%; border-radius: 5px; border: none; margin-bottom: 10px; font-family: 'Poppins', sans-serif;">
            <input type="password" id="password-input" placeholder="Password" style="padding: 10px; width: 80%; border-radius: 5px; border: none; margin-bottom: 15px; font-family: 'Poppins', sans-serif;">
            <p id="login-error" style="color: #ff6b6b; font-size: 13px; margin-top: 0; margin-bottom: 10px; display: none;"></p>
            <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px;">
                <button id="save-username-btn" style="padding: 10px 30px; font-size: 16px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 20px; font-family: 'Poppins', sans-serif;">Save</button>
                <button id="logout-btn" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: transparent; color: #ff6b6b; border: 1px solid #ff6b6b; border-radius: 20px; font-family: 'Poppins', sans-serif; display: none;">Logout</button>
            </div>
        </div>
    </div>

    <script src="quotes.js"></script>
    <script src="script.js"></script>
</body>
</html>
