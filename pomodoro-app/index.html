<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Focus</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <a href="/" class="home-btn">🏠</a>
    <div class="overlay"></div>
    <div class="container">
        <div class="quote-container">
            <p id="quote-text">"The secret of getting ahead is getting started."</p>
            <p id="quote-author">- Mark Twain</p>
            <div class="quote-nav">
                <button id="prev-quote" class="arrow-btn" data-tooltip="Previous quote">◀</button>
                <button id="explain-quote" class="arrow-btn" data-tooltip="Explain this quote" style="background: rgba(52, 152, 219, 0.5);">❓</button>
                <button id="next-quote" class="arrow-btn" data-tooltip="Next quote">▶</button>
            </div>
        </div>
        
        <div class="timer-card">
            <h2 id="mode-text">Work Session</h2>
            <div class="time-display" id="time-display">15:00</div>
            
            <div class="controls">
                <button id="start-btn">Start</button>
                <button id="pause-btn" style="display: none;">Pause</button>
                <button id="reset-btn">Reset</button>
            </div>
            
            <div class="settings">
                <div class="setting-group">
                    <label>Work (min)</label>
                    <div class="stepper">
                        <button class="step-btn" id="work-minus">-</button>
                        <span id="work-val">15</span>
                        <button class="step-btn" id="work-plus">+</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label>Rest (min)</label>
                    <div class="stepper">
                        <button class="step-btn" id="rest-minus">-</button>
                        <span id="rest-val">5</span>
                        <button class="step-btn" id="rest-plus">+</button>
                    </div>
                </div>
            </div>
            
            <div class="opacity-control" style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px;">
                <label style="font-size: 14px; opacity: 0.9; display: block; margin-bottom: 8px;">Visibility</label>
                <input type="range" id="opacity-slider" min="0" max="100" value="100" style="width: 80%; cursor: pointer;">
            </div>
        </div>
        
        <div class="bg-info-container">
            <p id="bg-location">Banff National Park, Canada</p>
            <p id="bg-photographer">Photo by Qusai Akoud</p>
            <div class="bg-nav">
                <button id="prev-bg" class="arrow-btn" data-tooltip="Previous background">◀</button>
                <button id="next-bg" class="arrow-btn" data-tooltip="Next background">▶</button>
            </div>
        </div>
    </div>

    <!-- Explanation Modal -->
    <div id="explanation-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px;">Quote Insight</h3>
            <p id="explanation-text" style="font-size: 14px; line-height: 1.5; opacity: 0.9; margin: 0;"></p>
        </div>
    </div>

    <script src="quotes.js"></script>
    <script src="script.js"></script>
</body>
</html>
